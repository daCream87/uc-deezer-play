name: "Build Music Play package"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PYTHON_VER: 3.11.12-0.3.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read manifest
        shell: bash
        run: |
          echo "VERSION=$(jq -r '.version' driver.json)" >> "$GITHUB_ENV"
          echo "DRIVER_ID=$(jq -r '.driver_id' driver.json)" >> "$GITHUB_ENV"

      - name: Check automatic release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          TAG="v${VERSION}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

          git fetch --tags --force

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Release tag ${TAG} already exists. Build will continue, but no new public release will be created."
            echo "CREATE_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "New version detected: ${VERSION}. Tag ${TAG} and GitHub Release will be created after a successful build."
            echo "CREATE_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Build AArch64 driver
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker run --rm --platform=aarch64 --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c "cd /workspace && \
              python -m pip install -r requirements.txt && \
              pyinstaller --clean --onedir --name intg-${DRIVER_ID} \
                --collect-all ucapi \
                --collect-all ucapi_framework \
                --collect-all music_assistant_client \
                --collect-all music_assistant_models \
                --collect-all zeroconf \
                intg_deezer_play/__main__.py"

      - name: Prepare package
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts/bin
          mv "dist/intg-${DRIVER_ID}/"* artifacts/bin/
          mv "artifacts/bin/intg-${DRIVER_ID}" artifacts/bin/driver
          chmod 755 artifacts/bin/driver
          cp driver.json artifacts/
          cp assets/music-play-logo.png artifacts/
          echo "ARTIFACT_NAME=uc-intg-${DRIVER_ID}-${VERSION}-aarch64" >> "$GITHUB_ENV"

      - name: Validate
        shell: bash
        run: |
          test -f artifacts/driver.json
          test -f artifacts/music-play-logo.png
          python - <<'PY'
          import struct
          from pathlib import Path
          logo = Path("artifacts/music-play-logo.png")
          with logo.open("rb") as f:
              assert f.read(8) == b"\x89PNG\r\n\x1a\n"
              length = struct.unpack(">I", f.read(4))[0]
              assert f.read(4) == b"IHDR" and length >= 8
              width, height = struct.unpack(">II", f.read(8))
          assert (width, height) == (90, 90), (width, height)
          print("Logo validated: 90x90")
          PY
          test -x artifacts/bin/driver
          test ! -e artifacts/bin/_internal/driver.json
          python -m compileall -q intg_deezer_play
          python - <<'PY'
          from pathlib import Path
          media = Path("intg_deezer_play/media_player.py").read_text(encoding="utf-8")
          ma = Path("intg_deezer_play/ma_client.py").read_text(encoding="utf-8")
          device = Path("intg_deezer_play/device.py").read_text(encoding="utf-8")
          assert 'media_id == "root"' in media
          assert "focus_current=True" in media
          assert '"musicplay://overview"' in media
          assert '"Läuft gerade"' in media
          assert 'getattr(queue, "sources"' in media
          assert "get_active_queue" in ma
          assert "queue_id: str" in device
          print("Current-playlist list-button behavior validated")
          PY
          python - <<'PY'
          from pathlib import Path
          media = Path("intg_deezer_play/media_player.py").read_text(encoding="utf-8")
          device = Path("intg_deezer_play/device.py").read_text(encoding="utf-8")
          setup = Path("intg_deezer_play/setup_flow.py").read_text(encoding="utf-8")
          ma = Path("intg_deezer_play/ma_client.py").read_text(encoding="utf-8")
          assert "Features.POWER" not in media
          assert "Commands.POWER" not in media
          remote = Path("intg_deezer_play/remote.py").read_text(encoding="utf-8")
          assert '"POWER_TOGGLE"' in remote
          assert '"stop_and_power_off"' in remote
          assert "stop_and_power_off" in device
          assert "create_long_lived_token" in setup
          assert "login_with_token" in ma
          print("Remote power/stop and login feature set validated")
          PY

          python - <<'PY'
          from pathlib import Path
          media = Path("intg_deezer_play/media_player.py").read_text(encoding="utf-8")
          init = Path("intg_deezer_play/__init__.py").read_text(encoding="utf-8")
          device = Path("intg_deezer_play/device.py").read_text(encoding="utf-8")
          assert "musicplay://radio" in media
          assert "_browse_artist" in media
          assert "_search_debounce_seconds = 0.8" in media
          assert "ADD_TO_FAVORITES" in media
          assert "MusicAssistantDiscovery" in init
          assert 'elif command == "favorite":' in device
          print("Music Play v0.3 feature set validated")
          PY
          python - <<'PY'
          from pathlib import Path
          src = Path("intg_deezer_play/__init__.py").read_text(encoding="utf-8")
          assert 'Path(sys.executable).resolve().parent / "driver.json"' in src
          print("Runtime manifest lookup validated")
          PY
          python - <<'PY'
          from pathlib import Path
          source = Path("intg_deezer_play/setup_flow.py").read_text(encoding="utf-8")
          config = Path("intg_deezer_play/config.py").read_text(encoding="utf-8")
          assert "prepare_input_from_discovery" in source
          assert "_authentication_form" in source
          assert "handle_additional_configuration_response" in source
          assert "create_long_lived_token" in source
          assert "MusicPlayMAClient" in source
          assert "self._pending_device_config" in source
          assert '"username"' in source
          assert '"password"' in source
          assert '"access_token"' in source
          assert "username:" not in config
          assert "password:" not in config
          compile(source, "setup_flow.py", "exec")
          print("Setup flow validated: discover/select -> auth screen -> token validation -> save")
          PY
          jq -e --arg v "$VERSION" '.driver_id == "music_play" and .version == $v' artifacts/driver.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          source = Path("intg_deezer_play/driver.py").read_text(encoding="utf-8")
          assert "DeezerRemote" not in source
          assert "entity_classes=[DeezerMediaPlayer]" in source
          print("Single visible media-player entity validated")
          PY

          python - <<'PY'
          from pathlib import Path
          source = Path("intg_deezer_play/driver.py").read_text(encoding="utf-8")
          assert "async def on_r2_enter_standby" in source
          assert "async def on_r2_exit_standby" in source
          assert "keeping Music Assistant connection alive" in source
          print("Standby keepalive handlers validated")
          PY

      - name: Create Remote 3 archive
        shell: bash
        run: |
          cd artifacts
          tar czf "../${ARTIFACT_NAME}.tar.gz" ./music-play-logo.png ./driver.json ./bin/
          cd ..
          tar tzf "${ARTIFACT_NAME}.tar.gz" | sed -n '1,30p'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Create version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CREATE_RELEASE == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Music Play ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CREATE_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TITLE="Music Play ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" \
            "${ARTIFACT_NAME}.tar.gz" \
            --title "${RELEASE_TITLE}" \
            --generate-notes \
            --repo "${GITHUB_REPOSITORY}"

      - name: Release status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ "${CREATE_RELEASE}" = "true" ]; then
            echo "Automatic release ${RELEASE_TAG} created with ${ARTIFACT_NAME}.tar.gz"
          else
            echo "Version ${VERSION} is already released. No new tag or GitHub Release was created."
          fi
